[package]
name = "pingtable"
description = "Ping many hosts and watch them in one table"
version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
hmac = "0.12.1"
pingtable-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tiny_http = "0.12"

[target."cfg(windows)".dependencies]
tao = "0.37.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }
wry = "0.57.2"

[build-dependencies]
embed-resource = "3.0.12"
